{{define "title"}}New Cluster Template{{end}}
{{define "content"}}
<h1>New Cluster Template</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<p class="muted">Saves a reusable install. It does not create a cluster.</p>
<form class="stack" method="post" action="/clusters/templates">
  <label for="name">Template name *</label>
  <input id="name" name="name" required pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?" placeholder="aws-default">

  <label for="installerImage">Installer image *</label>
  <input id="installerImage" name="installerImage" required value="{{.InstallerImage}}" placeholder="quay.io/openshift-release-dev/ocp-release:4.19.0-x86_64">

  <label for="credentialsSecret">Cloud credentials *</label>
  <select id="credentialsSecret" name="credentialsSecret" required>
    {{range .CloudSecrets}}
    <option value="{{.Name}}"{{if eq $.CredentialsSecret .Name}} selected{{end}}>{{.Name}}</option>
    {{else}}
    <option value="" disabled selected>No cloud credentials</option>
    {{end}}
  </select>
  <p class="muted"><a href="/clusters/credentials/new">Add cloud credentials</a></p>

  <label for="installConfig">install-config *</label>
  <textarea id="installConfig" name="installConfig" required rows="18">{{.InstallConfigYAML}}</textarea>

  <div class="toolbar" style="margin-top:1.25rem">
    <button class="btn primary" type="submit">Save template</button>
    <a class="btn" href="/clusters/templates">Cancel</a>
  </div>
</form>
{{end}}
